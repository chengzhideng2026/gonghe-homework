# ERPNext stack with pre-seeded Crestwind Compressor data.
#
# Candidate flow:
#   docker compose up -d
#   docker compose logs -f restore-site   # first run ~5 min (install + restore + migrate), later ~30 s
#   open http://localhost:8080
#   # Login: Administrator / admin
#
# Teardown (also wipes data):
#   docker compose down -v
#
# This file is a fork of frappe_docker's pwd.yml — the only meaningful change
# is that `create-site` is replaced by `restore-site`, which restores from
# the backup tarball baked into ./backup/.

x-image: &erpnext-image frappe/erpnext:v16.9.0

services:
  backend:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin

  configurator:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  # restore-site: one-shot service. Replaces frappe_docker's `create-site`.
  # On first boot:
  #   1. Wait for db + redis + common_site_config.json
  #   2. Create an empty `frontend` site shell (so bench has somewhere to restore into)
  #   3. Restore the pre-built backup over it
  #   4. Run `bench migrate` to apply any pending schema patches
  #   5. Provision the Administrator API key pair. This must happen here, before any web
  #      request: the encryption key is created lazily by the first worker that needs it
  #      and each gunicorn worker caches site_config, so a key issued via the UI on a
  #      fresh site is encrypted with one worker's key and rejected by the other.
  # On subsequent boots:
  #   - Detects `sites/frontend/site_config.json` and exits early.
  restore-site:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./backup:/backup:ro
    entrypoint: ["bash", "-c"]
    command:
      - >
        set -e;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json...";
          sleep 3;
          if (( `date +%s`-start > 120 )); then
            echo "ERROR: common_site_config.json never appeared.";
            exit 1
          fi
        done;
        if [ -f "sites/frontend/site_config.json" ]; then
          echo "Site 'frontend' already exists — skipping restore.";
          exit 0;
        fi;
        echo "Creating empty 'frontend' site shell...";
        bench new-site frontend --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default;
        echo "Restoring backup...";
        SQL=$$(ls /backup/db.sql.gz);
        PUB=$$(ls /backup/files.tar 2>/dev/null || true);
        PRIV=$$(ls /backup/private-files.tar 2>/dev/null || true);
        EXTRA="";
        if [ -n "$$PUB" ];  then EXTRA="$$EXTRA --with-public-files $$PUB"; fi;
        if [ -n "$$PRIV" ]; then EXTRA="$$EXTRA --with-private-files $$PRIV"; fi;
        bench --site frontend --force restore --db-root-username=root --db-root-password=admin "$$SQL" $$EXTRA;
        echo "Running migrate...";
        bench --site frontend migrate;
        echo "Provisioning the agent API key pair (see README)...";
        bench --site frontend execute frappe.db.set_value --args "['User','Administrator','api_key','crestwind-agent']";
        bench --site frontend execute frappe.utils.password.set_encrypted_password --kwargs "{'doctype':'User','name':'Administrator','pwd':'crestwind-agent-secret','fieldname':'api_secret'}";
        echo "Restore complete.";

  db:
    image: mariadb:10.6
    networks: [frappe_network]
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 1s
      retries: 20
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: *erpnext-image
    networks: [frappe_network]
    depends_on:
      - websocket
    deploy:
      restart_policy:
        condition: on-failure
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PORT:-8080}:8080"

  queue-long:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    command: [bench, worker, --queue, "long,default,short"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  queue-short:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    command: [bench, worker, --queue, "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  redis-queue:
    image: redis:6.2-alpine
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    command: [bench, schedule]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: *erpnext-image
    networks: [frappe_network]
    deploy:
      restart_policy:
        condition: on-failure
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
