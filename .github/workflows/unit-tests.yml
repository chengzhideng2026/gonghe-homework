name: Offline unit tests
on:
  pull_request:
    branches: [main-v2]
  push:
    branches: [release/detail-statistics-reviewed]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run complete offline regression
        run: python -m unittest discover -s tests -v
